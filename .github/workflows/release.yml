name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build universal macOS binary and publish release
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout treesize
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Read version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found" >&2
            exit 1
          fi

          SECTION=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" {
              if (in_section == 1) {
                if ($0 ~ "^## \\[" v "\\]") {
                  in_section = 1
                } else {
                  exit
                }
              }
            }
            $0 ~ "^## \\[" v "\\]" { in_section = 1 }
            in_section == 1 { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "Version section [$VERSION] not found in CHANGELOG.md" >&2
            exit 1
          fi

          TLDR=$(printf "%s\n" "$SECTION" | awk '/^### TLDR/{flag=1;next}/^### /{if(flag)exit}flag')
          TLDR=$(printf "%s\n" "$TLDR" | sed '/^[[:space:]]*$/d')
          if [ -z "$TLDR" ]; then
            echo "TLDR section for [$VERSION] is empty in CHANGELOG.md" >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          ## TreeSize ${GITHUB_REF_NAME}

          ### TLDR
          $TLDR

          Full detailed changes are available in CHANGELOG.md.

          ### Install via Homebrew

              brew install novaemx/tap/treesize
          EOF

      - name: Run tests
        run: go test ./...

      - name: Build universal macOS binary
        run: |
          mkdir -p dist
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "Runner arch: $(uname -m), SDK: $SDK"
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 \
            CGO_CFLAGS="-arch x86_64 -isysroot $SDK" \
            CGO_LDFLAGS="-arch x86_64 -isysroot $SDK" \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/treesize-darwin-amd64 ./cmd/treesize-mac
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 \
            CGO_CFLAGS="-arch arm64 -isysroot $SDK" \
            CGO_LDFLAGS="-arch arm64 -isysroot $SDK" \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/treesize-darwin-arm64 ./cmd/treesize-mac
          lipo -create -output dist/treesize-darwin-universal \
            dist/treesize-darwin-amd64 dist/treesize-darwin-arm64
          lipo -info dist/treesize-darwin-universal

      - name: Verify --version flag
        run: dist/treesize-darwin-universal --version

      - name: Package tarball
        id: package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TARBALL="treesize-${VERSION}-darwin-universal.tar.gz"
          cd dist && tar -czf "$TARBALL" treesize-darwin-universal
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tarball_path=dist/${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
          RELEASE_TARBALL_PATH: ${{ steps.package.outputs.tarball_path }}
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          cat >> release-notes.md <<EOF

          ### Direct download
          Universal macOS binary (Apple Silicon + Intel): ${RELEASE_TARBALL}

          **SHA256:** ${RELEASE_SHA256}
          EOF
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "TreeSize ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" "${RELEASE_TARBALL_PATH}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_TARBALL_PATH}" \
              --title "TreeSize ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Checkout homebrew-tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: novaemx/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tap
          ref: main

      - name: Update Homebrew formula
        if: env.TAP_TOKEN != ''
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA=${{ steps.package.outputs.sha256 }}
          URL="https://github.com/novaemx/treesize/releases/download/${GITHUB_REF_NAME}/treesize-${VERSION}-darwin-universal.tar.gz"
          FORMULA="homebrew-tap/Formula/treesize.rb"
          awk -v ver="$VERSION" -v url="$URL" -v sha="$SHA" '
            /^  url /     { print "  url \""     url "\""; next }
            /^  version / { print "  version \"" ver "\""; next }
            /^  sha256 /  { print "  sha256 \""  sha "\""; next }
            { print }
          ' "$FORMULA" > "${FORMULA}.tmp" && mv "${FORMULA}.tmp" "$FORMULA"

      - name: Commit and push formula update
        if: env.TAP_TOKEN != ''
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/treesize.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi
          git commit -m "feat: update treesize to ${{ github.ref_name }}"
          git push origin HEAD
