name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build universal macOS binary and publish release
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

    steps:
      - name: Checkout treesize
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Build universal macOS binary
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/treesize-darwin-amd64 ./cmd/treesize-mac
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/treesize-darwin-arm64 ./cmd/treesize-mac
          lipo -create -output dist/treesize-darwin-universal \
            dist/treesize-darwin-amd64 dist/treesize-darwin-arm64

      - name: Verify --version flag
        run: dist/treesize-darwin-universal --version

      - name: Package tarball
        id: package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TARBALL="treesize-${VERSION}-darwin-universal.tar.gz"
          cd dist && tar -czf "$TARBALL" treesize-darwin-universal
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tarball_path=dist/${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TreeSize ${{ github.ref_name }}"
          body: |
            ## TreeSize ${{ github.ref_name }}

            Native macOS disk usage analyzer.

            ### Install via Homebrew
            ```bash
            brew install novaemx/tap/treesize
            ```

            ### Direct download
            Universal macOS binary (Apple Silicon + Intel): `${{ steps.package.outputs.tarball }}`

            **SHA256:** `${{ steps.package.outputs.sha256 }}`
          files: ${{ steps.package.outputs.tarball_path }}

      - name: Checkout homebrew-tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: novaemx/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        if: env.TAP_TOKEN != ''
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA=${{ steps.package.outputs.sha256 }}
          URL="https://github.com/novaemx/treesize/releases/download/${GITHUB_REF_NAME}/treesize-${VERSION}-darwin-universal.tar.gz"
          FORMULA="homebrew-tap/Formula/treesize.rb"
          awk -v ver="$VERSION" -v url="$URL" -v sha="$SHA" '
            /^  url /     { print "  url \""     url "\""; next }
            /^  version / { print "  version \"" ver "\""; next }
            /^  sha256 /  { print "  sha256 \""  sha "\""; next }
            { print }
          ' "$FORMULA" > "${FORMULA}.tmp" && mv "${FORMULA}.tmp" "$FORMULA"

      - name: Commit and push formula update
        if: env.TAP_TOKEN != ''
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/treesize.rb
          git commit -m "feat: update treesize to ${{ github.ref_name }}"
          git push origin HEAD
